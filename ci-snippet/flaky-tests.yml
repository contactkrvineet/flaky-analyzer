# .github/workflows/flaky-tests.yml
#
# Drop this into your repo to make flakiness measurable. The key idea: a normal
# pipeline runs each test once per commit and produces NO flake data. This
# workflow reruns failing tests in the same build, so any test that fails then
# passes is recorded as a <flakyFailure> in the Surefire XML — a definitive
# flake signal — and then uploads those reports for the analyzer to read.
#
# Works for JUnit and TestNG via Maven Surefire. No pom.xml change required:
# rerunFailingTestsCount is passed as a command-line property.

name: flaky-tests

on:
  push:
  pull_request:
  # Optional but recommended: a nightly repeat run gives the strongest signal
  # (same commit, multiple results) on top of the rerun signal.
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Rerun failures up to 2 extra times so intermittent failures surface
      # as flakes instead of hard failures. Tune the count to taste.
      - name: Run tests (rerun failures to surface flakes)
        run: mvn -B test -Dsurefire.rerunFailingTestsCount=2

      # Upload the reports even when the build fails, so flakes are never lost.
      # The artifact name contains "test", which matches the analyzer's default
      # "artifact name has" filter.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 30
          if-no-files-found: warn

# ---------------------------------------------------------------------------
# pom.xml alternative (if you prefer config over the -D flag): add this to the
# maven-surefire-plugin so reruns happen on every run, including local ones.
#
#   <plugin>
#     <groupId>org.apache.maven.plugins</groupId>
#     <artifactId>maven-surefire-plugin</artifactId>
#     <configuration>
#       <rerunFailingTestsCount>2</rerunFailingTestsCount>
#     </configuration>
#   </plugin>
#
# Cucumber note: keep the JUnit/TestNG runner producing Surefire XML; the
# analyzer reads the standard <testcase>/<flakyFailure> elements, so no
# Cucumber-specific config is needed.
# ---------------------------------------------------------------------------
